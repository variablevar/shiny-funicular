version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: gtquant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtquant
      POSTGRES_PASSWORD: gtquant_local
      POSTGRES_DB: gtquant
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gtquant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: gtquant-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - timescaledb

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    container_name: gtquant-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow_data/mlflow.db
      --default-artifact-root /mlflow_data/artifacts
    volumes:
      - mlflow_data:/mlflow_data

  # Deribit options collector (no auth, public API)
  deribit_options:
    image: python:3.11-slim
    container_name: gtquant-deribit-options
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=gtquant
      - DB_USER=gtquant
      - DB_PASS=gtquant_local
      - DB_DSN=host=timescaledb dbname=gtquant user=gtquant password=gtquant_local
    command: >
      bash -c "pip install --quiet --no-cache-dir requests loguru psycopg2-binary numpy && python collectors/deribit_options.py"
    depends_on:
      - timescaledb

  # Binance futures REST collector -> ohlcv_1m microstructure bars
  live_collector:
    image: python:3.11-slim
    container_name: gtquant-live-collector
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DB_DSN=host=timescaledb dbname=gtquant user=gtquant password=gtquant_local
    command: >
      bash -c "pip install --quiet --no-cache-dir requests loguru psycopg2-binary && python collectors/live_collector.py"
    depends_on:
      - timescaledb

volumes:
  timescale_data:
  redis_data:
  grafana_data:
  mlflow_data:

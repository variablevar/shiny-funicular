version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: gtquant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gtquant
      POSTGRES_PASSWORD: gtquant_local
      POSTGRES_DB: gtquant
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtquant"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gtquant-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  grafana:
    image: grafana/grafana:latest
    container_name: gtquant-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - timescaledb

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.1.4
    container_name: gtquant-mlflow
    restart: unless-stopped
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow_data/mlflow.db
      --default-artifact-root /mlflow_data/artifacts
    volumes:
      - mlflow_data:/mlflow_data

  trade_lens:
    image: python:3.11-slim
    container_name: gtquant-trade-lens
    restart: unless-stopped
    ports:
      - "8001:8001"
    working_dir: /app
    volumes:
      - ./:/app
      - ./ft_userdata/user_data/data/binance/futures:/app/ft_userdata/user_data/data/binance/futures:ro
    environment:
      - FREQTRADE_URL=http://host.docker.internal:8080
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_NAME=gtquant
      - DB_USER=gtquant
      - DB_PASS=gtquant_local
    command: >
      bash -c "pip install --quiet --no-cache-dir fastapi uvicorn psycopg2-binary pandas requests pydantic loguru pyarrow && uvicorn services.trade_lens:app --host 0.0.0.0 --port 8001"
    depends_on:
      - timescaledb

  # Single-page Multi-TF Trade Lens viewer
  trade_lens_web:
    image: nginx:alpine
    container_name: gtquant-trade-lens-web
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./monitoring/web:/usr/share/nginx/html:ro

volumes:
  timescale_data:
  redis_data:
  grafana_data:
  mlflow_data:
